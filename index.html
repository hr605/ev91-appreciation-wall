<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV91 Appreciation Wall</title>
<style>
  :root{
    --bg: #0d1420;
    --bg-panel: #121b2b;
    --line: #223049;
    --ink: #e8edf5;
    --ink-dim: #8fa1bd;
    --accent: #35c98c;      /* pharma-green, matches ops dashboard */
    --accent-dim: #1f7a56;
    --amber: #e8a33d;       /* recognition highlight */
    --rx-paper: #f4ead9;    /* prescription-pad card color */
    --rx-ink: #2b2118;

  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 0%, #14203350, transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
  }
  .display{
    font-family: 'Georgia', 'Iowan Old Style', serif;
  }
  header{
    padding:28px 24px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand-eyebrow{
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:11px;
    color:var(--accent);
    font-weight:600;
    margin-bottom:6px;
  }
  h1{
    margin:0;
    font-size:28px;
    font-weight:400;
    letter-spacing:0.01em;
  }
  .sub{
    color:var(--ink-dim);
    font-size:13px;
    margin-top:4px;
  }
  .stats{
    display:flex;
    gap:22px;
  }
  .stat{ text-align:right; }
  .stat .num{ font-size:22px; font-family:'Georgia',serif; color:var(--accent); }
  .stat .lbl{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.08em; }

  main{
    max-width:1100px;
    margin:0 auto;
    padding:24px;
  }

  .composer{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    margin-bottom:28px;
  }
  .composer-title{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink-dim);
    margin-bottom:12px;
  }
  .row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .field{ flex:1; min-width:160px; display:flex; flex-direction:column; gap:6px; }
  label{ font-size:11px; color:var(--ink-dim); }
  input[type=text], textarea, select{
    background:#0b111c;
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:6px;
    padding:9px 10px;
    font-size:14px;
    font-family:inherit;
    outline:none;
  }
  input[type=text]:focus, textarea:focus, select:focus{ border-color:var(--accent); }
  textarea{ resize:vertical; min-height:64px; }

  .cat-picker{ display:flex; gap:8px; flex-wrap:wrap; max-width:640px; }
  .cat-chip{
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-dim);
    padding:6px 12px;
    border-radius:999px;
    font-size:11.5px;
    cursor:pointer;
  }
  .cat-chip.active{ color:#08111f; border-color:transparent; font-weight:700; }

  .submit-row{ display:flex; justify-content:flex-end; }
  button.primary{
    background:var(--accent);
    color:#08111f;
    border:none;
    font-weight:600;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
  }
  button.primary:disabled{ opacity:0.4; cursor:not-allowed; }

  .filters{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .filters span{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.08em; }

  .wall{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:18px;
  }
  .card{
    background:var(--rx-paper);
    color:var(--rx-ink);
    border-radius:3px 3px 8px 8px;
    padding:16px 16px 14px;
    position:relative;
    box-shadow:0 8px 18px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(0,0,0,0.05);
    transform:rotate(var(--tilt, 0deg));
    font-family:'Georgia',serif;
  }
  .card::before{
    content:'';
    position:absolute;
    top:-8px; left:50%;
    transform:translateX(-50%);
    width:14px; height:14px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe9b3, #c98a2b 70%);
    box-shadow:0 3px 5px rgba(0,0,0,0.4);
  }
  .card-tag{
    display:inline-block;
    font-family:'Segoe UI',sans-serif;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    margin-bottom:10px;
    color:#fff;
  }

  .card-to{ font-size:15px; font-weight:700; margin-bottom:2px; }
  .card-to span{ font-weight:400; font-size:12px; color:#6b5d47; }
  .card-msg{ font-size:14px; line-height:1.45; margin:8px 0 12px; }
  .card-footer{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Segoe UI',sans-serif;
    font-size:11px; color:#6b5d47;
    border-top:1px dashed #c9b892;
    padding-top:8px;
  }
  .cheer-btn{
    background:none; border:none; cursor:pointer;
    font-size:13px; color:#6b5d47;
    display:flex; align-items:center; gap:4px;
  }
  .cheer-btn.cheered{ color:var(--amber); font-weight:700; }

  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--ink-dim);
    border:1px dashed var(--line);
    border-radius:10px;
  }
  .empty b{ color:var(--ink); }

  footer{
    text-align:center;
    color:var(--ink-dim);
    font-size:11px;
    padding:30px 0 40px;
  }

  @media (max-width:520px){
    header{ padding:20px 16px; }
    main{ padding:16px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand-eyebrow">EV91 Technologies · Team Recognition</div>
    <h1 class="display">Appreciation Wall</h1>
    <div class="sub">Peer-to-peer only. Tag the action, not the adjective.</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Posted</div></div>
    <div class="stat"><div class="num" id="statWeek">0</div><div class="lbl">This week</div></div>
  </div>
</header>

<main>
  <div class="composer">
    <div class="composer-title">Post a shout-out</div>
    <div class="row">
      <div class="field">
        <label for="fromName">Your name</label>
        <input type="text" id="fromName" placeholder="e.g. Smita" maxlength="60">
      </div>
      <div class="field">
        <label for="toName">Who are you appreciating</label>
        <input type="text" id="toName" placeholder="e.g. colleague's name" maxlength="60">
      </div>
      <div class="field">
        <label for="store">Team / location (optional)</label>
        <input type="text" id="store" placeholder="e.g. Fleet Ops, Bangalore" maxlength="40">
      </div>
    </div>
    <div class="row">
      <div class="field" style="flex:2; min-width:280px;">
        <label for="msg">What did they actually do</label>
        <textarea id="msg" placeholder="Be specific: what happened, and what it fixed or unblocked." maxlength="280"></textarea>
      </div>
    </div>
    <div class="row" style="align-items:center;">
      <div class="field" style="flex:none;">
        <label>Category</label>
        <div class="cat-picker" id="catPicker"></div>
      </div>
    </div>
    <div class="submit-row">
      <button class="primary" id="postBtn" disabled>Post to wall</button>
    </div>
  </div>

  <div class="filters">
    <span>Filter:</span>
    <select id="filterCat">
      <option value="all">All categories</option>
    </select>
    <select id="sortBy">
      <option value="new">Newest first</option>
      <option value="cheers">Most cheered</option>
    </select>
  </div>

  <div class="wall" id="wall">
    <div class="empty">Loading the wall…</div>
  </div>
</main>

<footer>Shared board — visible to everyone with this link. Data persists across sessions.</footer>

<script>
const CATEGORIES = [
  { id:"rent",        label:"Max rent collected",        color:"#2e9e6b" },
  { id:"onboard",     label:"Max riders onboarded",       color:"#3d8bfd" },
  { id:"ageing",      label:"Payment ageing reduced",     color:"#16a3a3" },
  { id:"esat",        label:"Employee satisfaction",      color:"#e8557a" },
  { id:"engage",      label:"Employee engagement",        color:"#c264e8" },
  { id:"onroad",      label:"On-road support",            color:"#e8a33d" },
  { id:"teamwork",    label:"Team work",                  color:"#35c98c" },
  { id:"productivity",label:"Productivity",               color:"#fd6a3d" },
  { id:"innovation",  label:"Innovation",                 color:"#7a5cff" },
  { id:"ownership",   label:"Ownership",                  color:"#4d7cff" },
  { id:"custimpact",  label:"Customer impact",            color:"#ff5c8a" },
  { id:"cip",         label:"Continuous improvement",     color:"#2ec4b6" }
];
const CAT_LABELS = Object.fromEntries(CATEGORIES.map(c => [c.id, c.label]));
const CAT_COLORS = Object.fromEntries(CATEGORIES.map(c => [c.id, c.color]));
let selectedCat = null;
let posts = [];

const catPicker = document.getElementById('catPicker');
const postBtn = document.getElementById('postBtn');
const fromName = document.getElementById('fromName');
const toName = document.getElementById('toName');
const store = document.getElementById('store');
const msg = document.getElementById('msg');
const wall = document.getElementById('wall');
const filterCat = document.getElementById('filterCat');
const sortBy = document.getElementById('sortBy');

function buildCategoryUI(){
  catPicker.innerHTML = CATEGORIES.map(c =>
    `<button class="cat-chip" data-cat="${c.id}" type="button">${c.label}</button>`
  ).join('');

  filterCat.innerHTML = '<option value="all">All categories</option>' +
    CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
}
buildCategoryUI();

catPicker.addEventListener('click', (e) => {
  const btn = e.target.closest('.cat-chip');
  if(!btn) return;
  catPicker.querySelectorAll('.cat-chip').forEach(c => { c.classList.remove('active'); c.style.background=''; c.style.borderColor=''; });
  const color = CAT_COLORS[btn.dataset.cat];
  btn.classList.add('active');
  btn.style.background = color;
  btn.style.borderColor = color;
  selectedCat = btn.dataset.cat;
  validate();
});

[fromName, toName, msg].forEach(el => el.addEventListener('input', validate));

function validate(){
  postBtn.disabled = !(fromName.value.trim() && toName.value.trim() && msg.value.trim() && selectedCat);
}

function tilt(id){
  // deterministic small tilt per post so it doesn't shift on re-render
  let hash = 0;
  for(const ch of id) hash = (hash * 31 + ch.charCodeAt(0)) % 1000;
  return ((hash % 60) - 30) / 20; // -1.5deg .. 1.5deg
}

function timeAgo(ts){
  const diff = Date.now() - ts;
  const mins = Math.floor(diff/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + "h ago";
  const days = Math.floor(hrs/24);
  return days + "d ago";
}

async function loadPosts(){
  try{
    const stored = localStorage.getItem('appreciation-posts');
    posts = stored ? JSON.parse(stored) : [];
  }catch(e){
    posts = [];
  }
  render();
}

async function savePosts(){
  try{
    localStorage.setItem('appreciation-posts', JSON.stringify(posts));
  }catch(e){
    console.error('Save failed', e);
  }
}

async function addPost(){
  const post = {
    id: 'p' + Date.now() + Math.random().toString(36).slice(2,7),
    from: fromName.value.trim(),
    to: toName.value.trim(),
    store: store.value.trim(),
    text: msg.value.trim(),
    cat: selectedCat,
    cheers: 0,
    cheeredByMe: false,
    ts: Date.now()
  };
  posts.unshift(post);
  await savePosts();
  fromName.value = ''; toName.value = ''; store.value = ''; msg.value = '';
  catPicker.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  selectedCat = null;
  validate();
  render();
}

async function toggleCheer(id){
  const p = posts.find(x => x.id === id);
  if(!p) return;
  if(p.cheeredByMe){ p.cheers = Math.max(0, p.cheers - 1); p.cheeredByMe = false; }
  else { p.cheers += 1; p.cheeredByMe = true; }
  await savePosts();
  render();
}

postBtn.addEventListener('click', addPost);
filterCat.addEventListener('change', render);
sortBy.addEventListener('change', render);

function render(){
  document.getElementById('statTotal').textContent = posts.length;
  const weekAgo = Date.now() - 7*24*60*60*1000;
  document.getElementById('statWeek').textContent = posts.filter(p => p.ts > weekAgo).length;

  let list = posts.slice();
  if(filterCat.value !== 'all') list = list.filter(p => p.cat === filterCat.value);
  if(sortBy.value === 'cheers') list.sort((a,b) => b.cheers - a.cheers);
  else list.sort((a,b) => b.ts - a.ts);

  if(list.length === 0){
    wall.innerHTML = '<div class="empty"><b>No shout-outs yet.</b><br>Be the first — name what someone actually did.</div>';
    return;
  }

  wall.innerHTML = list.map(p => `
    <div class="card" style="--tilt:${tilt(p.id)}deg">
      <span class="card-tag" style="background:${CAT_COLORS[p.cat] || '#888'}">${CAT_LABELS[p.cat] || p.cat}</span>
      <div class="card-to">${escapeHtml(p.to)} ${p.store ? `<span>· ${escapeHtml(p.store)}</span>` : ''}</div>
      <div class="card-msg">${escapeHtml(p.text)}</div>
      <div class="card-footer">
        <span>— ${escapeHtml(p.from)} · ${timeAgo(p.ts)}</span>
        <button class="cheer-btn ${p.cheeredByMe ? 'cheered' : ''}" onclick="toggleCheer('${p.id}')">👏 ${p.cheers}</button>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadPosts();
</script>

</body>
</html>
